<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Las Palmas Schedule Hub</title>
</head>

<body>
  <form
    name="game-change-request"
    method="POST"
    data-netlify="true"
    data-netlify-honeypot="bot-field"
    hidden
  >
    <input type="hidden" name="form-name" value="game-change-request" />
    <input name="bot-field" />
    <input name="requester-name" />
    <input name="requester-email" />
    <input name="requester-phone" />
    <input name="team" />
    <input name="game" />
    <input name="game-details" />
    <input name="change-type" />
    <input name="requested-date" />
    <input name="requested-start-time" />
    <input name="requested-end-time" />
    <input name="requested-home" />
    <input name="requested-away" />
    <input name="requested-location" />
    <input name="requested-field" />
    <input name="requested-division" />
    <input name="requested-other" />
    <input name="reason" />
  </form>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
