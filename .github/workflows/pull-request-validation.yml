name: Pull request validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-schedule:
    name: Validate schedule timestamps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Check changed game timestamps
        run: node scripts/validate-game-revisions.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
